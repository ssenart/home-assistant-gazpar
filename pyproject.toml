[project]
name = "home-assistant-gazpar"
version = "1.3.15a2"
description = "GrDF Gazpar integration permits to integrate in Home Assistant all your gas consumption data"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
authors = [
    { name = "Stéphane Senart" }
]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pygazpar>=1.4.0a4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio==1.4.0",
    "mypy>=2.4.0,<3.0.0",
    "ruff>=0.16.10,<0.17.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "homeassistant>=2026.9.0,<2027.0.0",
    "pytest-homeassistant-custom-component==0.13.367",
]

[tool.uv]
required-version = ">=0.13.0"
# A Home Assistant custom component is not installed as a package: it is copied into the configuration directory.
package = false

[tool.mypy]
exclude = [ ".venv" ]

[tool.ruff]
exclude = [ ".venv", "*.md" ]
line-length = 120

[tool.ruff.lint]
# E501 is ignored: ruff format owns the line length, and long strings are left as they are.
select = ["E", "F", "W", "I", "B", "UP", "ARG", "RET", "BLE"]
ignore = ["E501"]