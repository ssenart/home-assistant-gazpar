[project]
name = "home-assistant-gazpar"
version = "1.3.15a1"
description = "GrDF Gazpar integration permits to integrate in Home Assistant all your gas consumption data"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
authors = [
    { name = "Stéphane Senart" }
]
classifiers = [
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pygazpar>=1.4.0a3",
]

[tool.poetry]
requires-poetry = ">=2.0"
include = ["CHANGELOG.md"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "1.4.0"
mypy = "^2.4.0"
ruff = "^0.16.10"
python-dotenv = "^1.0.1"
homeassistant = "^2026.9.0"
pytest-homeassistant-custom-component = "0.13.367"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = [ ".venv" ]

[tool.ruff]
exclude = [ ".venv", "*.md" ]
line-length = 120

[tool.ruff.lint]
# E501 is ignored: ruff format owns the line length, and long strings are left as they are.
select = ["E", "F", "W", "I", "B", "UP", "ARG", "RET", "BLE"]
ignore = ["E501"]