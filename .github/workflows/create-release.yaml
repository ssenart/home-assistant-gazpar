name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (PEP 440): 0.5.1a4 on develop, 0.5.1b1 or 0.5.1rc1 on release/0.5.1, 0.5.1 on main"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run: validate, bump and build, but do not push, publish or release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_PYTHON_VERSION: "3.14"

jobs:
  #----------------------------------------------
  # Preflight: validate everything before anything is changed or published
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Read the CI status of the commit
    outputs:
      is_prerelease: ${{ steps.checks.outputs.is_prerelease }}
      last_tag: ${{ steps.checks.outputs.last_tag }}
    steps:
      #----------------------------------------------
      # Check-out repo, with all tags
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      #----------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      #----------------------------------------------
      # Validate the version against the branch, the existing tags and the changelog
      - name: Validate version, branch, tags and changelog
        id: checks
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip install --quiet packaging
          python3 - <<'EOF'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          from packaging.version import InvalidVersion, Version


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout.strip()


          version_text = os.environ["VERSION"].strip()
          branch = os.environ["BRANCH"]

          try:
              version = Version(version_text)
          except InvalidVersion:
              fail(f"'{version_text}' is not a valid PEP 440 version (e.g. 0.5.1a4, 0.5.1b1, 0.5.1)")
          if version.is_devrelease or version.local:
              fail("Dev and local versions cannot be released")

          kind = version.pre[0] if version.pre else None  # "a", "b", "rc" or None for a final version

          # Channel rules: which version kind is allowed on which branch
          if branch == "main":
              if kind is not None:
                  fail("main only accepts final versions (e.g. 0.5.1)")
          elif branch == "develop":
              if kind != "a":
                  fail("develop only accepts alpha versions (e.g. 0.5.1a4)")
          elif branch.startswith("release/"):
              if kind not in ("b", "rc"):
                  fail("release/* only accepts beta (bN) or release candidate (rcN) versions")
              if version.base_version != branch.removeprefix("release/"):
                  fail(f"Version base {version.base_version} does not match branch {branch}")
          else:
              fail(f"Releases are not allowed from branch '{branch}'")

          # The version must be new and must be greater than every existing tag
          if version_text in git("tag", "--list").splitlines():
              fail(f"Tag {version_text} already exists")
          tags = []
          for name in git("tag", "--list").splitlines():
              try:
                  tags.append((Version(name), name))
              except InvalidVersion:
                  pass
          last_tag = ""
          if tags:
              highest, last_tag = max(tags)
              if version <= highest:
                  fail(f"{version_text} must be greater than the highest existing tag {last_tag}")

          # The changelog must have something to release
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(r"^## \[Unreleased\][^\n]*\n(.*?)(?=^## \[|\Z)", changelog, re.M | re.S)
          if not section or not section.group(1).strip():
              fail("The [Unreleased] section of CHANGELOG.md is missing or empty")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_prerelease={'true' if kind else 'false'}\n")
              output.write(f"last_tag={last_tag}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Preflight passed\n\n")
              summary.write("| | |\n|---|---|\n")
              summary.write(f"| Version | `{version_text}` |\n")
              summary.write(f"| Branch | `{branch}` |\n")
              summary.write(f"| Last tag | `{last_tag or '-'}` |\n")
              summary.write(f"| Pre-release | {'yes' if kind else 'no'} |\n")
          EOF

      #----------------------------------------------
      # Check that CI passed on this exact commit
      - name: Check CI status of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 60); do
            state="$(gh run list --workflow ci.yaml --branch "$BRANCH" --limit 30 --json headSha,status,conclusion \
              | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | .[0] | "\(.status // "missing") \(.conclusion // "")"')"
            case "$state" in
              "completed success") echo "CI passed on $GITHUB_SHA"; exit 0 ;;
              "completed "*) echo "::error::CI on commit $GITHUB_SHA finished with '${state#completed }', it must be 'success'"; exit 1 ;;
              *) echo "CI on $GITHUB_SHA is '${state%% *}', waiting ($attempt/60)"; sleep 30 ;;
            esac
          done
          echo "::error::Timed out after 30 minutes waiting for CI on $GITHUB_SHA (last state: '$state')"
          exit 1

  #----------------------------------------------
  # Release: bump, finalize the changelog, then commit, tag and create the GitHub release.
  # Nothing is published outside GitHub: the integration is installed from its release tag (HACS).
  release:
    name: Release ${{ inputs.version }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the bump commit and the tag, create the GitHub release
    env:
      VERSION: ${{ inputs.version }}
      LAST_TAG: ${{ needs.preflight.outputs.last_tag }}
    steps:
      #----------------------------------------------
      # Check-out repo, with all tags
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      #----------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      #----------------------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv

      #----------------------------------------------
      # Bump the version in pyproject.toml and in the integration manifest
      - name: Bump version files
        run: |
          poetry version "$VERSION"
          jq --arg v "$VERSION" '.version = $v' custom_components/gazpar/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/gazpar/manifest.json

      #----------------------------------------------
      # Finalize CHANGELOG.md: [Unreleased] becomes the version, a new empty [Unreleased] is added on top.
      # The released section is exported as the GitHub release notes.
      - name: Finalize CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import datetime
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          last_tag = os.environ["LAST_TAG"]
          path = Path("CHANGELOG.md")
          # Read without newline translation: keep every line's own ending (some changelogs mix CRLF and LF)
          with open(path, encoding="utf-8", newline="") as f:
              text = f.read()

          # The body of [Unreleased] runs from its heading up to the next version heading
          section = re.search(r"^## \[Unreleased\][^\r\n]*\r?\n(?P<body>.*?)(?=^## \[|\Z)", text, re.M | re.S)
          heading_eol = "\r\n" if text[section.start():text.index("\n", section.start())].endswith("\r") else "\n"
          body = section.group("body")
          today = datetime.date.today().isoformat()
          text = (
              text[: section.start()]
              + f"## [Unreleased]{heading_eol}{heading_eol}## [{version}] - {today}{heading_eol}"
              + body
              + text[section.end():]
          )

          # Compare links at the bottom of the file, regenerated for the new version
          remote = subprocess.run(["git", "remote", "get-url", "origin"], capture_output=True, text=True, check=True).stdout.strip()
          repo = re.sub(r"^(git@github\.com:|https://github\.com/)", "https://github.com/", remote).removesuffix(".git")
          links = [f"[Unreleased]: {repo}/compare/{version}...HEAD"]
          if last_tag:
              links.append(f"[{version}]: {repo}/compare/{last_tag}...{version}")
          lines = [l for l in text.splitlines(keepends=True) if not re.match(rf"^\[(Unreleased|{re.escape(version)})\]: ", l)]
          first_footer = next((i for i, l in enumerate(lines) if re.match(r"^\[[^\]]+\]: ", l)), None)
          if first_footer is None:
              if lines and lines[-1].strip():
                  lines.append(heading_eol)
              lines.extend(link + heading_eol for link in links)
          else:
              footer_eol = "\r\n" if lines[first_footer].endswith("\r\n") else "\n"
              lines[first_footer:first_footer] = [link + footer_eol for link in links]
          with open(path, "w", encoding="utf-8", newline="") as f:
              f.write("".join(lines))

          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(body.strip() + "\n", encoding="utf-8")
          EOF

      #----------------------------------------------
      # Commit the version bump, tag it and push both atomically
      - name: Commit version bump
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          git add pyproject.toml CHANGELOG.md custom_components/gazpar/manifest.json
          git commit --allow-empty -m "Bump version to $VERSION"

      - name: Tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --atomic origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/$VERSION"

      #----------------------------------------------
      # Create the GitHub release from the changelog section
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
        run: |
          args=(--title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$(git rev-parse HEAD)")
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          url="$(gh release create "$VERSION" "${args[@]}")"
          echo "- GitHub release: $url" >> "$GITHUB_STEP_SUMMARY"

      #----------------------------------------------
      # Summary report, written even when a step failed
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Release $VERSION: ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Last tag | \`${LAST_TAG:--}\` |"
            echo "| Pre-release | ${{ needs.preflight.outputs.is_prerelease }} |"
            echo "| Draft | ${{ inputs.draft }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo ""
            echo "Files changed:"
            echo '```'
            git diff --stat "origin/$GITHUB_REF_NAME" 2>/dev/null || echo "(no changes)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
