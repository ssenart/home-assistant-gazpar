name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('CI: {0}', github.ref_name) || '' }}"

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - feature/*
  pull_request: ~
  workflow_dispatch:
    inputs:
      skip-lint:
        description: "Skip linting"
        required: false
        default: false
        type: boolean
      skip-tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read # Read-only access

env:
  DEFAULT_PYTHON_VERSION: "3.14"
  TARGET_PYTHON_VERSIONS: "[ '3.14' ]"

jobs:
  #----------------------------------------------
  # Collect information
  prepare:
    name: Prepare
    outputs:
      target_python_versions: ${{ env.TARGET_PYTHON_VERSIONS }}
      default_python_version: ${{ env.DEFAULT_PYTHON_VERSION }}
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      # Display Github environment variables
      - name: Display Github environment variables
        run: printenv | grep '^GITHUB_' | sort

      #----------------------------------------------
      # Check-out repo
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #----------------------------------------------
      # Send to Github Actions
      - name: Display information
        run: |
          echo "target-python-versions=${{ env.TARGET_PYTHON_VERSIONS }}"
          echo "default-python-version=${{ env.DEFAULT_PYTHON_VERSION }}"

  #----------------------------------------------
  # Lint
  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-lint }}
    steps:
      #----------------------------------------------
      #  Check-out repo
      - name: Check out repository
        uses: actions/checkout@v4

      #----------------------------------------------
      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      #----------------------------------------------
      # Install uv, which uses the Python set up above
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          enable-cache: true

      #----------------------------------------------
      # Install project
      - name: Install project
        run: uv sync --locked

      #----------------------------------------------
      # Check the formatting
      - name: Ruff format
        run: uv run --locked ruff format --check .

      #----------------------------------------------
      # Lint the code
      - name: Ruff check
        run: uv run --locked ruff check .

      #----------------------------------------------
      # Check the types
      - name: Mypy
        run: uv run --locked mypy .

  #----------------------------------------------
  # Test
  test:
    name: Test
    needs: [prepare, lint]
    runs-on: "ubuntu-latest"
    if: ${{ !inputs.skip-tests }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJSON(needs.prepare.outputs.target_python_versions) }}
    steps:
      #----------------------------------------------
      #  Check-out repo
      - name: Check out repository
        uses: actions/checkout@v4

      #----------------------------------------------
      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      #----------------------------------------------
      # Install uv, which uses the Python set up above
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      #----------------------------------------------
      # Install project
      - name: Install project
        run: uv sync --locked

      #----------------------------------------------
      # Run the tests
      - name: Test with pytest
        run: uv run --locked pytest tests
        env:
          GRDF_USERNAME: ${{ secrets.GRDF_USERNAME }}
          GRDF_PASSWORD: ${{ secrets.GRDF_PASSWORD }}
          PCE_IDENTIFIER: ${{ secrets.PCE_IDENTIFIER }}               
